<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Type conversion from boolean and number to string
        let a1 = 10;
        console.log(a1);
        console.log(typeof a1);
        let b1 = String(a1);
        console.log(b1);
        console.log(typeof b1);


        console.log('\n');
        
        
        let a = false;
        console.log(a);
        console.log(typeof a);
        let b = String(a);
        console.log(b);
        console.log(typeof b);

        console.log("\n");

        //Type conversion from Number String to Boolean

        let p = "123Tap";
        // let p = " 1 2 3";
        console.log(p);
        console.log(typeof p);
        let r = parseInt(p);
        console.log(r);
        console.log(typeof r); 

        console.log("\n");

        let s = true;
        console.log(s);
        console.log(typeof s);
        let t = Number(s);
        console.log(t);
        console.log(typeof t);

        let a11 = "";
        console.log(a11);
        console.log(typeof a11);
        console.log(Boolean(a11));

        let undefined_var;
        console.log(undefined_var);

        let null_var = null;
        console.log(null_var);

        
    </script>
</body>
</html>
